name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Every linter runs even when an earlier one fails — one push should surface
  # every problem, not just the first.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        if: always()
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          find . -name '*.sh' -not -path './cache/*' \
                 -not -path './claude-code-best-practice/*' \
            -print0 | xargs -0 shellcheck -e SC1091
          # Executables without a .sh suffix, which the find above cannot see.
          shellcheck -e SC1091 bin/devil tools/orch/timed

      - name: shfmt
        if: always()
        run: |
          curl -fsSL -o /tmp/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64
          chmod +x /tmp/shfmt
          find . -name '*.sh' -not -path './cache/*' \
                 -not -path './claude-code-best-practice/*' \
            -exec /tmp/shfmt -d -i 2 {} +
          /tmp/shfmt -d -i 2 bin/devil tools/orch/timed

      - name: markdownlint
        if: always()
        run: |
          npm install -g markdownlint-cli@0.42.0
          markdownlint '**/*.md' \
            --ignore node_modules --ignore cache --ignore claude-code-best-practice

      - name: python syntax
        if: always()
        run: python3 -m py_compile hooks/scripts/*.py

      - name: json is valid
        if: always()
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json \
                   hooks/hooks.json hooks/config/hooks-config.json \
                   templates/settings.json templates/mcp.json \
                   settings.local.json.example; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" \
              && echo "ok   $f" || { echo "FAIL $f"; exit 1; }
          done

  # The config must tell the truth about itself. This is the gate that stops the
  # README drifting from the tree again.
  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tools/selfcheck.sh --strict
        run: bash tools/selfcheck.sh --strict
      # Not --strict: the A14 `Use when` migration is slice M4's work, and a
      # warning that is a tracked migration is not a broken gate.
      - name: tools/skillcheck.sh
        run: bash tools/skillcheck.sh
      - name: tools/context.sh
        run: bash tools/context.sh --summary
      - name: tools/caveat.sh --strict
        run: bash tools/caveat.sh --strict
      - name: tools/release.sh --check
        run: bash tools/release.sh --check
      # The README tables are generated: a row that no longer matches the
      # frontmatter is a stale claim in the first document a reader opens.
      - name: tools/index.sh --check
        run: bash tools/index.sh --check
      # A generated copy of the kit is a second source of truth unless something
      # fails when it drifts from the Claude sources.
      - name: tools/export.sh --check opencode
        run: bash tools/export.sh --check opencode
      - name: tools/export.sh --check gemini
        run: bash tools/export.sh --check gemini

  # The root must load as a Claude Code plugin. Validating plugin.json also reads
  # hooks/hooks.json; validating the root would pick marketplace.json and skip it.
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install claude code
        run: npm install -g @anthropic-ai/claude-code
      - name: claude plugin validate --strict
        run: |
          rc=0
          for t in .claude-plugin/plugin.json .claude-plugin/marketplace.json \
                   ./skills ./agents ./commands; do
            echo "── $t"
            claude plugin validate "$t" --strict || rc=1
          done
          exit $rc

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install shellcheck (a gate under test uses it)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: run every test
        run: |
          rc=0
          for t in tests/test_*.sh; do
            echo "── $t"
            bash "$t" || rc=1
          done
          exit $rc

  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install the gates quality.sh will find
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      # --no-audit: the network audits are not this repo's concern (no deps).
      - name: tools/quality.sh
        run: bash tools/quality.sh --no-audit
