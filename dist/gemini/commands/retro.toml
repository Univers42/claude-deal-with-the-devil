# GENERATED by 'devil export gemini' from the kit's Claude-format sources. Do not edit; run 'devil export gemini' instead.
description = "Turn what went wrong in a session or a pull request into checks to build and rules to propose. Usage: /retro [<pr> | <git range>]"
prompt = """
# Retro

Subject: {{args}}

A session ends with two kinds of loss: the things a machine could have caught, and the
things it could not. Sorting them is the whole job. Keep the first as a check, and
make the second a one-line rule someone can read.

**This command proposes and writes nothing.** No file is edited, no tool is built, no
rule is changed. The two lists in the Report are the deliverable; a person decides
what ships.

## 1. Read the evidence

- A PR number: `gh pr view <n>` for the description and the review threads,
  `gh pr diff <n>` for what changed. If `gh` is absent, say SKIP and fall back to the
  local range for the same branch.
- A git range (`<from>..<to>`): `git log --stat` and `git diff` over it.
- Nothing: this session. The commands that ran and failed, the files edited, the gate
  rows that came back red, the places you guessed instead of looking. A tool that
  already knows: `devil quality --summary` for what the gate saw, `git status` for
  what is still in the tree.
- Caveat: a session with no transcript leaves only what the tree and the git state
  remember. What was said, considered and dropped is invisible here, so a finding you
  cannot tie to a command, a `file:line` or a gate row is not a finding yet.

## 2. List what went wrong or cost time

One line per finding, each with the evidence that made it a finding:

- **What happened**: the mistake, the false start, the dead end, or the step that
  took ten tries. Not a feeling: the command that returned the wrong thing, the
  `file:line` that was wrong, the review comment that caught it.
- **Cost**: one of: a wrong edit reverted, a gate row that failed and had to be
  re-run, a fact re-derived that a tool already prints, a person waiting.
- Drop anything you cannot tie to evidence. \"It felt slow\" is not a finding; \"I read
  the schema three times before `devil facts` named the test command\" is.

## 3. Classify each finding

- **Mechanical**: a machine could have caught it, every time, without being told. The
  tell: the same input would trip the same tool. A missing `Caveat:` on a heuristic, a
  documented name that does not resolve, a field the harness never reads, a test that
  never ran because nobody typed it.
- **Judgement**: it needed a person, a reviewer, or a taste call. The tell: a person
  had to weigh two defensible options, or the rule that was broken is one a machine
  cannot read the context for.
- Caveat: this split is a judgement too, and it is wrong in a specific way: a finding
  that looks mechanical because it recurred once is really a judgement call that has
  not been written down yet. When you cannot tell, put it in the judgement list with
  the ambiguity stated. Nothing is lost by the second list; something is lost when a
  rule nobody understands gets a tool built for it.

## 4. Mechanical findings: a brief for the forger

One brief per finding, each naming:

- **The check**: what must be caught, stated so a script can decide it.
- **The tool that owns the concern**: `devil selfcheck` (a documented name that does
  not resolve, a frontmatter field the harness never reads), `devil caveat` (an
  approximation that does not admit it), a frontmatter and description lint, or a new
  `tools/<name>.sh` when no gate owns the concern yet.
- **The FAIL case**: the bad input the check must reject, as a fixture. A check with
  no fixture that fails on purpose is a hope, not a gate (`agents/forger.md`).
- **Cost of being wrong**: what this finding cost, so the forger can weigh it against
  the noise a new check makes.

Then hand the briefs to the `forger` agent, or paste them into a new session. Do not
forge the check here.

## 5. Judgement findings: a proposed bullet and its home

One bullet per finding, in the voice of the file it belongs to:

- **The bullet**: one line, imperative, specific enough to change a decision. \"Extract
  before you duplicate the third time\" beats \"write better code\".
- **The target**: the file it belongs in: `rules/<x>.md` when it constrains every
  task, `skills/<name>/SKILL.md` when it fires on a kind of file, `agents/<name>.md`
  when it is one agent's judgement to make. Never the README, which is the index.

Propose the text; a person edits the rule. A retro that rewrites the rules it finds
missing has no way to tell whether the rule is any good.

## Report

Two lists, and nothing else. No files written, no tool built, no rule changed.

**Mechanical: briefs for the `forger`** (`<finding>` → check · tool · FAIL fixture · cost)

| Finding | Check | Tool | FAIL fixture | Cost |
|---|---|---|---|---|
| <finding> | <what must be caught> | <the tool that owns it> | <the bad input> | <what it cost> |

**Judgement: proposed bullets** (`<finding>` → bullet · target file)

| Finding | Proposed bullet | Target |
|---|---|---|
| <finding> | <one line> | `rules/<x>.md` / `skills/<name>/SKILL.md` / `agents/<name>.md` |

Then the return block (`status`, `gates`, `changed`, `deviations`, `next`) and the count
of findings dropped for want of evidence. A proposed bullet is not a change: nothing
here is on disk until a person edits the file it names.
"""
